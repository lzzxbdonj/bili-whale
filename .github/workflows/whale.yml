name: whale

# 小鲸鱼娘的云端身体：本机关机也照常上班。
#   - 每 30 分钟一次 patrol：放行主人点头的草稿 → 回私信 → 回主人评论 → 排一条视频评论草稿 → 到点发学习动态
#   - 一天三次 study：自己找方向、自己挑视频学、写笔记；觉得有意义的留言进待确认箱
#
# 关于频率（2026-10-05 深夜再调一次）：
#   白天主人选过「仓库转公开 + 每 5 分钟」（公开仓库 Actions 免费），但当天
#   Cloudflare KV 的免费写额度（1000 写/天）中午就被写爆——`*/5` 光 Actions 这条链
#   一天就是 288 轮 × 1 次 nonce 校验写 ≈ 300 写，占了额度的三分之一，加上本机对账
#   就超支了；写光之后云端整条链路停摆（详见 lib/cloudsync.js 的注释）。
#   现在收到 */10：一天 144 轮，配合本机那边的「省额度地板」，全天写量约 500~600 写，
#   留出余量。想回到 5 分钟一轮，得先给 KV 升级付费版（见对话里的方案 B）。
on:
  schedule:
    - cron: '*/10 * * * *'   # patrol（UTC；北京时间为每 10 分钟一次）
    - cron: '0 1,9,13 * * *' # study（北京时间 09:00 / 17:00 / 21:00）
  workflow_dispatch:
    inputs:
      task:
        description: '要跑的任务'
        required: false
        default: patrol
        type: choice
        options: [patrol, dm, daily, study, report, brain, login]

concurrency:
  group: whale
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # 只为把学习笔记（notes/）提交回仓库
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 决定这次跑什么
        id: pick
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "task=${{ inputs.task }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 1,9,13 * * *" ]; then
            echo "task=study" >> "$GITHUB_OUTPUT"
          else
            echo "task=patrol" >> "$GITHUB_OUTPUT"
          fi

      - name: 干活
        env:
          WHALE_URL: ${{ secrets.WHALE_URL }}
          WHALE_TOKEN: ${{ secrets.WHALE_TOKEN }}
          BILI_COOKIES: ${{ secrets.BILI_COOKIES }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TZ: Asia/Shanghai
        run: node cloud/run.mjs --task=${{ steps.pick.outputs.task }}

      # 学习笔记存回仓库：notes/knowledge-base.md 就是她的知识库，攒着不丢。
      # （只提交 notes/，不碰别的文件；没有变化就跳过。）
      - name: 把学习笔记存回仓库
        run: |
          if [ -z "$(git status --porcelain notes)" ]; then
            echo "notes/ 没有变化，跳过"
            exit 0
          fi
          git config user.name "whale-bot"
          git config user.email "whale-bot@users.noreply.github.com"
          git add notes
          git commit -m "chore(notes): 云端学习笔记 $(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M')"
          git push
