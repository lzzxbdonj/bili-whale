# 小鲸鱼娘女仆 · 云端常驻（Cloudflare Worker + 定时触发）
#
# 部署：见同目录 README.md（一条龙：建 KV → 写机密 → deploy → 验证）。
# 说明：Worker 负责 7×24 巡检（回复消息中心的评论、按策略发动态、把视频一级评论排成待确认草稿），
#      本机 DSH 插件（dsh-bilibili-whale）负责「主人点头」与更细的交互。
name = "bili-whale"
main = "src/index.js"
compatibility_date = "2026-01-01"
workers_dev = true

# 定时巡检：每 30 分钟一次。每日动态的时点由 DAILY_DYNAMIC_AT（默认 20:30，Asia/Shanghai）
# 在巡检里判断，因此 cron 只用一条固定频率，避免 UTC 换算踩坑。
#
# 为什么从 10 分钟放到 30 分钟（2026-10-05）：每次巡检都要往 KV 写日志/状态，而 KV 免费额度是
# **1000 写/天**——*/10 光这一条链就是 144 写/天，本机对账再来一轮就把额度写光；写光之后
# putJson 静默失败，云端会拿着几小时前的旧账本重复回复同一条评论（主人看到的刷屏就是这么来的）。
[triggers]
crons = ["*/30 * * * *"]

[vars]
# —— 身份 ——
OWNER_NAME = "懒寻真"
OWNER_MID = "3494364865103885"
WHALE_NAME = "寻和橼的大肥鱼dsh"
WHALE_MID = "3747560556595480"
TIMEZONE = "Asia/Shanghai"

# —— 策略（与插件端同一套语义；云端强约束，模型绕不过）——
# ⚠ 这里的 [vars] 会**盖住** `src/policy.js` 的代码默认值（varsConfig → deepMerge），
#   改默认值时两处要一起改，否则云端还在按老数字办事（今天就是这么踩的）。
POST_VIDEO_COMMENT = "confirm"
POST_REPLY = "auto"
POST_DYNAMIC = "auto"
DAILY_VIDEO_COMMENTS = "5"
DAILY_REPLIES = "5"
DAILY_DYNAMICS = "1"
MIN_INTERVAL_SECONDS = "60"
MIN_INTERVAL_SECONDS_OWNER = "15"
MAX_COMMENT_CHARS = "200"
REPLY_PER_USER_PER_THREAD = "1"
REPLY_PER_USER_WINDOW_HOURS = "24"
DAILY_DYNAMIC_AT = "20:30"
FEED_SOURCE = "popular"

# —— 观察模式 ——
# true = 只读 + 排队（不发任何写请求）；false = 允许 Worker 自己动手。
# 主人 2026-10-05 下午发话「开始往云端搬项目，观察模式关掉」⇒ 改 false 并重新 deploy。
# 注意：Worker 的出口 IP 被 B 站 -412 拦着，它其实登录不上（nav.isLogin=false），
# 所以真正干活的是 GitHub Actions 那条线（cloud/run.mjs，本来就不看这个开关）。
# 这个开关现在只影响：① Worker 自己那次 cron 巡检的 canWrite；② 遥控台手动发
# （/comment、/reply、/dynamic 在 true 时会回 409）。
OBSERVE_ONLY = "false"

# —— 文案模型（Workers AI）——
PERSONA_MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"

# —— KV：账本 / 待确认草稿 / 运行时指纹 / 主人覆盖的配置 ——
[[kv_namespaces]]
binding = "WHALE_KV"
id = "ca2d07df63b548f2bcf95b99d497ac3f"

# —— Workers AI：用来按鲸鱼娘人格写评论/回复/动态（未绑定时自动回退模板）——
[ai]
binding = "AI"

[observability]
enabled = true
